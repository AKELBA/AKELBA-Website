<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 580" role="img" aria-labelledby="title desc">
<title id="title">AKELBAの3段階プロセス</title>
<desc id="desc">三角シンボルを中心に、上に優先順位、右下に改善、左下に定着を配置した図</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FBFCFC"/><stop offset="100%" stop-color="#F4F7F8"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/><stop offset="100%" stop-color="#F8FBFC" stop-opacity="0.98"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#163A5F" stroke-opacity=".06" stroke-width="1"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0B2741" flood-opacity=".12"/></filter>
  <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2741" flood-opacity=".08"/></filter>
</defs>
<rect width="660" height="580" fill="url(#bg)"/>
<rect x="24" y="26" width="612" height="500" rx="34" fill="url(#panel)" stroke="#DCE5EA" filter="url(#shadow)"/>
<rect x="24" y="26" width="612" height="500" rx="34" fill="url(#grid)" opacity="0.95"/>

<!-- top chip slightly lower than Ver2.2.5 -->
<g filter="url(#chipShadow)">
  <rect x="228" y="104" width="204" height="78" rx="24" fill="#FFFFFF" stroke="#D7E2E8"/>
</g>
<rect x="252" y="126" width="52" height="36" rx="13" fill="#E8F7F6"/>
<text x="278" y="150" text-anchor="middle" fill="#1A8E97" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">01</text>
<text x="328" y="152" fill="#163A5F" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="24" font-weight="800">優先順位</text>

<!-- bottom left chip midway between Ver2.2.4 and Ver2.2.5 -->
<g filter="url(#chipShadow)">
  <rect x="71" y="374" width="178" height="78" rx="24" fill="#FFFFFF" stroke="#D7E2E8"/>
</g>
<rect x="95" y="396" width="52" height="36" rx="13" fill="#E8F7F6"/>
<text x="121" y="420" text-anchor="middle" fill="#1A8E97" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">03</text>
<text x="171" y="422" fill="#163A5F" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="24" font-weight="800">定着</text>

<!-- bottom right chip aligned with 03 -->
<g filter="url(#chipShadow)">
  <rect x="412" y="374" width="160" height="78" rx="24" fill="#FFFFFF" stroke="#D7E2E8"/>
</g>
<rect x="436" y="396" width="52" height="36" rx="13" fill="#E8F7F6"/>
<text x="462" y="420" text-anchor="middle" fill="#1A8E97" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">02</text>
<text x="512" y="422" fill="#163A5F" font-family="'Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="24" font-weight="800">改善</text>

<!-- central symbol -->
<g transform="translate(330,302)">
  <g transform="translate(-62,-82)" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M0 120 L62 0 L124 120" stroke="#163A5F" stroke-width="19"/>
    <path d="M-14 146 H138" stroke="#1FA6A3" stroke-width="14"/>
  </g>
</g>
</svg>